<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#edf3f8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f1720"
    />
    <meta name="color-scheme" content="light dark" />
    <title>MyFinance — Không có kết nối</title>
    <style>
      :root {
        color-scheme: light;
        --page: #edf3f8;
        --surface: #ffffff;
        --border: #c7d5e2;
        --text: #294760;
        --muted: #5f7890;
        --primary: #2f80ed;
        --primary-hover: #256fce;
        --shadow: 0 18px 44px rgba(35, 67, 92, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--page);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(
            circle at 82% 0%,
            rgba(47, 128, 237, 0.09),
            transparent 24rem
          ),
          var(--page);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(100%, 420px);
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        padding: 28px;
        box-shadow: var(--shadow);
        text-align: center;
      }

      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: rgba(47, 128, 237, 0.12);
        color: var(--primary);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(24px, 7vw, 30px);
        line-height: 1.2;
        letter-spacing: -0.025em;
      }

      .copy {
        max-width: 32ch;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .retry {
        min-height: 46px;
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: var(--primary);
        padding: 0 22px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 750;
        text-decoration: none;
        touch-action: manipulation;
      }

      .retry:focus-visible {
        outline: 3px solid rgba(47, 128, 237, 0.3);
        outline-offset: 3px;
      }

      @media (hover: hover) and (pointer: fine) {
        .retry:hover {
          background: var(--primary-hover);
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #0f1720;
          --surface: #17212b;
          --border: #314556;
          --text: #e7eef5;
          --muted: #a9bac8;
          --primary: #7db4ff;
          --primary-hover: #9ac5ff;
          --shadow: 0 18px 44px rgba(0, 0, 0, 0.38);
        }

        body {
          background:
            radial-gradient(
              circle at 82% 0%,
              rgba(91, 162, 255, 0.14),
              transparent 24rem
            ),
            var(--page);
        }

        .mark {
          background: rgba(59, 130, 246, 0.16);
        }

        .retry {
          background: #3b82f6;
          color: #ffffff;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="offline-title">
        <div class="mark" aria-hidden="true">MF</div>
        <p class="eyebrow">MYFINANCE</p>
        <h1 id="offline-title">Bạn đang ngoại tuyến</h1>
        <p class="copy" id="offline-copy">
          MyFinance chưa thể kết nối. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi
          thử lại để tải nội dung mới nhất.
        </p>
        <a class="retry" href="" aria-describedby="offline-copy">Thử lại</a>
      </section>
    </main>
  </body>
</html>
